name = "lester-glenn-reviews"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Dashboard files. Every request goes through the Worker first so nobody
# sees the dashboard without signing in with Microsoft.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "lester-glenn-reviews"
database_id = "ee207814-a254-4b70-9098-a9835b36efd9"
migrations_dir = "migrations"

# Cloudflare schedules in UTC, which doesn't change for daylight saving. The
# Worker wakes at both possible UTC times for each run and only works when it
# is one of RUN_HOURS_ET in New York, so runs stay at 8am, 12pm, 4pm, 8pm
# Eastern all year. If you change RUN_HOURS_ET, add the matching UTC hours
# here (Eastern hour + 4 and + 5).
[triggers]
crons = ["0 0,1,12,13,16,17,20,21 * * *"]

[vars]
# dry_run: sample data only | shadow: reads Google, never posts | live: posts replies
AGENT_MODE = "dry_run"
# Microsoft 365 sign-in, from the Entra app registration
MS_TENANT_ID = "cebd3ada-40a6-4d78-b4ca-02472b1b7d7b"
MS_CLIENT_ID = "ffed32c7-e735-4e6f-9ab9-97b89a2c5e32"
# Only these domains can receive escalation emails
MAIL_ALLOWED_DOMAINS = "lesterglenn.com"
# Always admins, even before anyone is added in Settings
ADMIN_EMAILS = "mcostanzo@lesterglenn.com"
# Only these people can approve, edit, redraft or dismiss replies
REPLY_APPROVERS = "mcostanzo@lesterglenn.com,mbellina@lesterglenn.com"
MAX_AGE_DAYS = "14"
MAX_DRAFTS_PER_RUN = "25"
AUTO_POST_MIN_STARS = "4"
CLAUDE_MODEL = "claude-sonnet-5"
# Hours (24h, Eastern) when scheduled runs happen
RUN_HOURS_ET = "8,12,16,20"
# Max Google + Claude calls per run. Free plan limit is 50; keep 45 there.
EXTERNAL_REQUEST_BUDGET = "45"
# Pages of older reviews (50 each) imported per run for statistics
BACKFILL_PAGES_PER_RUN = "20"

# Secrets (set with: npx wrangler secret put NAME)
# MS_CLIENT_SECRET, ANTHROPIC_API_KEY, GBP_CLIENT_ID, GBP_CLIENT_SECRET, GBP_REFRESH_TOKEN
